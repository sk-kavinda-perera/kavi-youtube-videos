<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoVault — Curated Video Collections</title>
<meta name="description" content="Hand-picked video collections across tech, science, travel and more. Updated daily.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --surface: #161719;
    --border: #2a2b2e;
    --accent: #e8c547;
    --accent2: #4f8ef7;
    --text: #e8e6e0;
    --muted: #6b6966;
    --card: #1c1d20;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  /* ── NAV ── */
  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(14,15,17,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(1rem, 4vw, 3rem);
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    letter-spacing: -0.02em;
    color: var(--text);
    text-decoration: none;
  }

  .logo span { color: var(--accent); }

  nav ul {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  nav a:hover { color: var(--text); }

  /* ── HERO ── */
  .hero {
    padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 4vw, 3rem) clamp(2rem, 5vw, 4rem);
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 2rem;
    border-bottom: 1px solid var(--border);
  }

  .hero-tag {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .hero-tag::before {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--accent);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 4rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.03em;
    max-width: 600px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-meta {
    text-align: right;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.8;
  }

  .hero-meta strong {
    display: block;
    font-size: 2rem;
    font-family: 'Playfair Display', serif;
    color: var(--text);
    font-weight: 400;
  }

  /* ── CATEGORIES ── */
  .categories {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.5rem clamp(1rem, 4vw, 3rem);
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }

  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    padding: 0.4rem 1rem;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .cat-btn.active, .cat-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* ── GRID ── */
  .grid-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2.5rem clamp(1rem, 4vw, 3rem);
  }

  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: -0.02em;
  }

  .section-count {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
  }

  /* ── VIDEO CARD ── */
  .video-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .video-card:hover {
    transform: translateY(-3px);
    border-color: #3a3b3e;
  }

  .video-embed {
    position: relative;
    padding-bottom: 56.25%;
    background: #000;
  }

  .video-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .card-body {
    padding: 1rem 1.1rem 1.2rem;
  }

  .card-category {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 0.4rem;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    line-height: 1.4;
    letter-spacing: -0.01em;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .card-desc {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .card-views {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 2rem clamp(1rem, 4vw, 3rem);
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (max-width: 600px) {
    .hero { grid-template-columns: 1fr; }
    .hero-meta { text-align: left; }
    nav ul { display: none; }
  }
</style>
</head>
<body>

<nav>
  <a href="#" class="logo">Video<span>Vault</span></a>
  <ul>
    <li><a href="#">Collections</a></li>
    <li><a href="#">Trending</a></li>
    <li><a href="#">Topics</a></li>
    <li><a href="#">About</a></li>
  </ul>
</nav>

<div class="hero">
  <div>
    <div class="hero-tag">Daily Picks</div>
    <h1>The internet's best<br><em>videos</em>, curated.</h1>
  </div>
  <div class="hero-meta">
    <strong id="video-count">0</strong>
    videos today
  </div>
</div>

<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all')">All</button>
  <button class="cat-btn" onclick="filterCat('tech')">Technology</button>
  <button class="cat-btn" onclick="filterCat('science')">Science</button>
  <button class="cat-btn" onclick="filterCat('travel')">Travel</button>
  <button class="cat-btn" onclick="filterCat('music')">Music</button>
  <button class="cat-btn" onclick="filterCat('education')">Education</button>
  <button class="cat-btn" onclick="filterCat('entertainment')">Entertainment</button>
</div>

<div class="grid-wrapper">
  <div class="section-header">
    <h2 class="section-title">Today's Collection</h2>
    <span class="section-count" id="showing-count"></span>
  </div>
  <div class="video-grid" id="video-grid"></div>
</div>

<footer>
  <span>© 2025 VideoVault. Curated with care.</span>
  <span>Updated daily · <a href="#" style="color:var(--muted)">Submit a video</a></span>
</footer>

<script>
// ── VIDEO LIST — edit these to add/remove videos ──────────────────────────────
// Format: { id: 'YouTube_video_ID', title: '...', desc: '...', cat: 'tech|science|travel|music|education|entertainment' }
const VIDEOS = [
  // REPLACE THESE WITH YOUR YOUTUBE VIDEO IDs
  { id: 'QYenHnL2AcA', title: 'All About Valorant gameplay:|PART 00 |HD 👀👀', desc: 'A fascinating look at productivity systems used by the world\'s top performers.', cat: 'gaming' },
  { id: '2bY5Bajuh6I', title: 'All About Valorant gameplay:|PART 01 |HD 👀👀', desc: 'The very first video uploaded to YouTube, marking the start of a new era.', cat: 'gaming' },
  { id: 'ic6ChEMtS-I', title: 'All About Valorant gameplay:|PART 02 |HD 👀👀', desc: 'An open-source animated short film from the Blender Institute.', cat: 'gaming' },
  { id: 'DRjj0xidzfM', title: 'All About Valorant gameplay:|PART 1.3 |HD 👀👀', desc: 'One of the most iconic viral moments in early internet history.', cat: 'gaming' },
  { id: '83HdZ7Jyhpg', title: 'All About Valorant gameplay:|PART 1.4 |HD 👀👀', desc: 'The classic animated GIF set to music that took the internet by storm.', cat: 'gaming' },
];

// ── RENDER ────────────────────────────────────────────────────────────────────
let currentFilter = 'all';

function getFiltered() {
  return currentFilter === 'all' ? VIDEOS : VIDEOS.filter(v => v.cat === currentFilter);
}

function filterCat(cat) {
  currentFilter = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function randomViews() {
  return (Math.floor(Math.random() * 900) + 100).toLocaleString() + ' views';
}

function timeAgo() {
  const opts = ['2 hours ago', '4 hours ago', '6 hours ago', 'Today', 'Yesterday'];
  return opts[Math.floor(Math.random() * opts.length)];
}

function catLabel(cat) {
  return cat.charAt(0).toUpperCase() + cat.slice(1);
}

function renderGrid() {
  const filtered = getFiltered();
  const grid = document.getElementById('video-grid');

  document.getElementById('showing-count').textContent = `${filtered.length} video${filtered.length !== 1 ? 's' : ''}`;
  document.getElementById('video-count').textContent = VIDEOS.length;

  grid.innerHTML = filtered.map((v, i) => `
    <div class="video-card" style="animation-delay:${i * 0.06}s" data-cat="${v.cat}">
      <div class="video-embed">
        <iframe
          src="https://www.youtube.com/embed/${v.id}?autoplay=0&rel=0&modestbranding=1"
          title="${v.title}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
      <div class="card-body">
        <div class="card-category">${catLabel(v.cat)}</div>
        <h3 class="card-title">${v.title}</h3>
        <p class="card-desc">${v.desc}</p>
        <div class="card-footer">
          <span class="card-views">▶ ${randomViews()}</span>
          <span>${timeAgo()}</span>
        </div>
      </div>
    </div>
  `).join('');
}

renderGrid();
</script>
</body>
</html>
